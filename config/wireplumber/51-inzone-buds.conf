# Sony INZONE Buds USB dongle, PC mode (054c:0ec2)
#
# The USB card number is deliberately not used. Match the stable USB identity
# and Pro Audio profile node suffixes discovered from the hardware descriptors.

# Create the card directly in Pro Audio, the only profile exposing Game and
# Chat together. Without this, WirePlumber first starts the analog profile and
# inzone-autoswitch switches it afterwards; a switch racing that startup was
# observed once to leave the analog nodes behind. A profile the user saved
# explicitly still takes precedence. WirePlumber versions without this section
# ignore it and keep relying on inzone-autoswitch.
device.profile.priority.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x054c"
        device.product.id = "0x0ec2"
      }
    ]
    actions = {
      update-props = {
        priorities = [ "pro-audio" ]
      }
    }
  }
]

monitor.alsa.rules = [
  {
    matches = [
      {
        alsa.components = "USB054c:0ec2"
        node.name = "~alsa_output[.]usb-Sony_INZONE_Buds.*[.]pro-output-0"
      }
    ]
    actions = {
      update-props = {
        node.description = "Sony INZONE Buds - Chat"
        node.nick = "INZONE Chat"
        priority.session = 1400
      }
    }
  }
  {
    matches = [
      {
        alsa.components = "USB054c:0ec2"
        node.name = "~alsa_output[.]usb-Sony_INZONE_Buds.*[.]pro-output-1"
      }
    ]
    actions = {
      update-props = {
        node.description = "Sony INZONE Buds - Game"
        node.nick = "INZONE Game"
        priority.session = 1450
      }
    }
  }
  {
    matches = [
      {
        alsa.components = "USB054c:0ec2"
        node.name = "~alsa_input[.]usb-Sony_INZONE_Buds.*[.]pro-input-0"
      }
    ]
    actions = {
      update-props = {
        node.description = "Sony INZONE Buds - Microphone"
        node.nick = "INZONE Microphone"
        priority.session = 1450
      }
    }
  }
]
