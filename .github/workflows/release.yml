name: Release

# Pushing a vX.Y.Z tag verifies that the tag, inzonectl, the metainfo and the
# CHANGELOG agree, publishes a GitHub release with the CHANGELOG section as
# notes plus a checksummed tarball, and opens a PR that bumps the PKGBUILD.
# Publishing to the AUR stays manual (see packaging/arch/README.md).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify the tag matches the sources
        id: ver
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ $(sed -n 's/^VERSION=//p' bin/inzonectl) == "$version" ]]
          grep -q "<release version=\"$version\"" data/metainfo/*.metainfo.xml
          tools/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run the tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck appstream desktop-file-utils python3-gi gir1.2-gtk-4.0
          tests/lint.sh
          INZONE_REQUIRE_GTK_TESTS=1 tests/run-all.sh

      - name: Build the tarball
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir dist
          git archive --format=tar.gz \
            --prefix="sony-inzone-buds-linux-$VERSION/" \
            -o "dist/inzone-buds-mixer-$VERSION.tar.gz" "$GITHUB_REF_NAME"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Open the PKGBUILD bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -c "packaging/pkgbuild-$VERSION" origin/main
          tools/bump-pkgbuild.sh "$VERSION"
          git commit -am "packaging: bump PKGBUILD to $VERSION"
          git push origin "packaging/pkgbuild-$VERSION"
          if ! gh pr create --base main --head "packaging/pkgbuild-$VERSION" \
            --title "packaging: bump PKGBUILD to $VERSION" \
            --body "Automated: pkgver and sha256sums for the $GITHUB_REF_NAME tarball."; then
            # The release itself is already published. Without the repository
            # setting "Allow GitHub Actions to create and approve pull requests"
            # the branch is pushed but the PR must be opened by hand.
            echo "::warning::Could not open the PR; open one from packaging/pkgbuild-$VERSION."
          fi
