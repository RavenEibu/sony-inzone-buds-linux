name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly: catches breakage from new runner images or package versions.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck appstream desktop-file-utils python3-gi gir1.2-gtk-4.0 gettext pipx
          pipx install ruff

      - name: Lint
        env:
          INZONE_REQUIRE_RUFF: "1"
        run: tests/lint.sh

      - name: Tests
        env:
          INZONE_REQUIRE_GTK_TESTS: "1"
          INZONE_REQUIRE_GETTEXT: "1"
          INZONE_REQUIRE_VALIDATORS: "1"
        run: tests/run-all.sh

  wireplumber-conf:
    # Parses the WirePlumber config with PipeWire's own SPA-JSON parser, which
    # the Ubuntu runner above cannot provide in a 0.5-compatible version.
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm pipewire wireplumber python

      - uses: actions/checkout@v7

      - name: Validate config/wireplumber
        env:
          INZONE_REQUIRE_SPA_JSON: "1"
        run: python3 tests/test_wireplumber_conf.py

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 python3-venv
          python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install coverage

      - name: Coverage
        env:
          INZONE_REQUIRE_GTK_TESTS: "1"
        run: |
          PATH="$RUNNER_TEMP/venv/bin:$PATH" tests/coverage.sh | tee "$RUNNER_TEMP/coverage.txt"
          { echo '```text'; cat "$RUNNER_TEMP/coverage.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
