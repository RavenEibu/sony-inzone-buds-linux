name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly: catches breakage from new runner images or package versions.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck appstream desktop-file-utils python3-gi gir1.2-gtk-4.0 gettext pipx
          pipx install ruff

      - name: Lint
        env:
          INZONE_REQUIRE_RUFF: "1"
        run: tests/lint.sh

      - name: Tests
        env:
          INZONE_REQUIRE_GTK_TESTS: "1"
          INZONE_REQUIRE_GETTEXT: "1"
        run: tests/run-all.sh
