name: Debian package

# Builds the .deb in a clean Debian container and lints it. debian/changelog
# is generated here from inzonectl's VERSION, so it never drifts.

on:
  pull_request:
    paths:
      - debian/**
      - .github/workflows/deb-package.yml
  push:
    branches: [main]
    paths:
      - debian/**
      - .github/workflows/deb-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential debhelper devscripts lintian

      - uses: actions/checkout@v7

      - name: Generate debian/changelog
        run: |
          version=$(sed -n 's/^VERSION=//p' bin/inzonectl)
          export DEBFULLNAME="CI" DEBEMAIL="ci@invalid"
          dch --create --package inzone-buds-mixer --newversion "$version" \
            --distribution unstable "Build of $version."

      - name: Build
        run: dpkg-buildpackage -us -uc -b

      - name: Lintian
        run: lintian --fail-on error ../inzone-buds-mixer_*_all.deb
